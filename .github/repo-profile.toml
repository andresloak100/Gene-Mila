# The repository's public face beyond README.md. GitHub's About box and social preview are
# repository settings, not files, so this is their source of truth:
#   python tools/readme_check.py               validates it with the README
#   python tools/readme_check.py --gh-command  prints the `gh repo edit` command that applies it
# The social preview image is uploaded by hand under Settings > General > Social preview.
# The readme-designer agent (.claude/agents/readme-designer.md) keeps this in sync with the README.

[about]
description = "An autonomous lab for single-cell perturbation prediction, tested on held-out perturbations of the Adamson (CRISPRi) and Norman (CRISPRa) Perturb-seq screens: Claude plans, DeepSeek workers write one feature per experiment, and only a linear model may use them, so every gain is a feature you can read."
homepage = ""
topics = [
  "perturb-seq",
  "single-cell",
  "perturbation-prediction",
  "crispr-screens",
  "gene-expression",
  "computational-biology",
  "llm-agents",
  "ai-scientist",
  "autonomous-research",
  "feature-engineering",
  "interpretable-ml",
  "ridge-regression",
  "claude",
  "deepseek",
]
social_preview = "docs/assets/social-preview.png"

[readme]
path = "README.md"
# Every section or figure that shows a score names the data it comes from: one of these.
results_labels = ["synthetic", "Adamson", "Norman"]
# Headings contributors and the build scripts rely on; rename them here first if they move.
required_headings = [
  "Abstract",
  "Current status",
  "Results on Adamson",
  "Results on Norman",
  "Can the agents find new biology?",
  "Methods",
  "Synthetic check of the machinery",
  "Limitations",
  "Data and code availability",
  "Reproducibility",
  "References",
]
max_badges = 3
