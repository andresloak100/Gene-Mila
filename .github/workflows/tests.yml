name: Tests

# The full pytest suite on every push and pull request, installed from the pinned set in
# requirements-lock.txt on Python 3.13, the version the Mac's runs record. readme-check.yml keeps
# its own quicker checks. No test needs the network, the data under data/ or an API key.
on:
  pull_request:
  push:

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the pinned dependencies
        run: pip install -r requirements-lock.txt
      - name: Run the full suite
        run: python -m pytest -q
