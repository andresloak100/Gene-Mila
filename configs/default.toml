# Gene-Mila autonomous laboratory configuration.
# Everything here is controller-side; agents never read or modify it.

[run]
dataset = "synthetic"          # name of a prepared dataset under data/
minutes = 20.0                 # wall-clock budget (overridden by --minutes/--hours)
workers = 4                    # asynchronous research worker slots
cpu_slots = 0                  # concurrent CPU experiments; 0 = number of cores
shutdown_grace_s = 30          # how long running experiments may finish after the deadline
status_interval_s = 10
min_free_disk_mb = 2000        # stop starting experiments when the disk holding the run has less free space
seed = 0

[experiment]
timeout_s = 300                # per-experiment CPU-run timeout
ram_limit_mb = 4096            # RLIMIT_AS for the experiment subprocess
cpu_limit_s = 600              # RLIMIT_CPU for the experiment subprocess
max_attempts = 2               # infrastructure retries (never scientific retries)
max_new_features = 1           # one controlled change per experiment
executor = "forkserver"        # forkserver (warm, fast start) | subprocess (fresh interpreter each time)
feature_cache = true           # reuse computed feature blocks and shared matrices within a run
feature_cache_max_mb = 4096    # oldest cached feature blocks are evicted beyond this
keep_all_alphas = false        # keep every alpha's predictions in predictions.npz (else only the chosen one)
cv_folds = 5                   # model selection also uses out-of-fold predictions for the training
                               # perturbations (K folds, fixed per run); 0 = visible validation set only
default_model = "ridge"
default_alpha_grid = [0.01, 0.1, 1.0, 10.0, 100.0]

[schedule]
explore = 0.65
exploit = 0.25
risky = 0.10
queue_low_water = 0            # refill when queued < this; 0 = 2 x workers (keeps workers busy while the planner thinks)
planner_batch = 0              # hypotheses per planner round; 0 = 2 x workers, between 6 and 12
planner_concurrency = 0        # planner rounds allowed at once, each with its own focus; 0 = ceil(workers / 6)
planner_min_interval_s = 60    # back-off after a planner round that failed or produced nothing new
max_planner_calls = 0          # 0 = no limit (the planner dollar cap still applies)
replicates_max = 3             # same hypothesis to independent workers
python_exploit = true          # queue deterministic follow-ups around the best model (add a helpful feature,
                               # ablate, refine alpha, swap model family) whenever fewer are queued than workers

[planner]
provider = "claude_cli"        # claude_cli | anthropic | scripted
model = "opus"
max_output_tokens = 6000
timeout_s = 300

[worker]
provider = "deepseek"          # deepseek | claude_cli | mock | openai_compat
model = "deepseek-flash"
escalation_provider = ""       # e.g. "claude_cli" with escalation_model = "sonnet"
escalation_model = ""
llm_retries = 1                # implementation retries before escalation
max_output_tokens = 8000       # hidden reasoning counts against this limit
thinking = "disabled"          # DeepSeek: "disabled" | "enabled" | "" (API default: enabled, effort high)
reasoning_effort = ""          # DeepSeek with thinking enabled: "low" | "high" | "max"
timeout_s = 120

[budget]
max_total_usd = 0.25           # hard cap on worker-LLM spend in one run; new calls are refused beyond it
max_planner_usd = 0            # planner cap for one run; 0 = planner_usd_per_worker_hour x max(4, workers) x hours
planner_usd_per_worker_hour = 4.0   # measured: about $2 per worker-hour with Opus proposing 2 ideas per worker
api_retries = 1                # retries of a retryable API error (429/5xx/network), never more
circuit_breaker_failures = 5   # failed calls within 2 min (no success) that pause a provider; cooldown 60 s doubling to 10 min
ledger = "runs/spend_ledger.sqlite"   # cumulative spend across runs
max_tokens_per_experiment = 30000
max_tokens_per_worker = 0      # 0 = no per-worker limit (the dollar caps bound spend)

# Cumulative caps across ALL runs that share the ledger (development budget).
[budget.cumulative_usd]
deepseek = 0.25

# USD per million tokens, from https://api-docs.deepseek.com/quick_start/pricing (checked 2026-10-03).
# DeepSeek bills peak (01-04 and 06-10 UTC, Mon-Fri) at twice off-peak; the PEAK rates are used here so
# estimates never undercount. The API serves the legacy name "deepseek-chat" with deepseek-flash.
[pricing."deepseek-flash"]
input_cache_hit = 0.006
input_cache_miss = 0.30
output = 1.20

[pricing."deepseek-chat"]
input_cache_hit = 0.006
input_cache_miss = 0.30
output = 1.20

[pricing."deepseek-v4-pro"]
input_cache_hit = 0.044
input_cache_miss = 1.32
output = 3.96

# Used when a model has no entry here and the provider reports no cost (deliberately pessimistic).
[pricing.default]
input_cache_hit = 3.0
input_cache_miss = 3.0
output = 15.0

[pricing.mock]
input_cache_hit = 0.0
input_cache_miss = 0.0
output = 0.0

[pricing.loadtest]
input_cache_hit = 0.0
input_cache_miss = 0.0
output = 0.0

[final]
top_k = 3                      # visible-validation winners evaluated on the query-only set
max_queries = 5                # hard cap on query-only evaluations per run (top_k + ensemble + baseline)
ensemble = true                # also try the average of the top_k finalists, kept only if it wins on the visible set
celleval = true                # also score finalists with Arc's cell-eval when held-out cells exist
celleval_profile = "full"      # cell-eval profile: full | minimal | vcc | de

# Extra settings per provider kind, e.g. an OpenAI-compatible endpoint:
# [providers.openai_compat]
# base_url = "https://api.x.ai/v1"      # Grok; or https://api.openai.com/v1, http://localhost:11434/v1 ...
# api_key_env = "XAI_API_KEY"
# name = "grok"
